<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktail Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Cocktail Menu</h1>
  <p>Menu interactivo para bartenders principiantes</p>
</header>

<div class="bar-scene">

  <!-- drinks sit above the table -->
  <div class="drinks-row">
    <div class="drink-slot beer" onclick="showLabel(this)" data-name="Beer">
      <span class="drink-label"></span>
      <img src="images/beer.png" alt="Beer">
    </div>
    <div class="drink-slot aperol" onclick="showLabel(this)" data-name="Aperol Spritz">
      <span class="drink-label"></span>
      <img src="images/aperol-spritz.png" alt="Aperol Spritz">
    </div>
    <div class="drink-slot martini" onclick="showLabel(this)" data-name="Classic Martini">
      <span class="drink-label"></span>
      <img src="images/martini.png" alt="Martini">
    </div>
    <div class="drink-slot pina" onclick="showLabel(this)" data-name="Piña Colada">
      <span class="drink-label"></span>
      <img src="images/pina-colada.png" alt="Piña Colada">
    </div>
  </div>

  <div class="table"></div>

</div>

<script src="js/script.js"></script>
</body>
</html>
